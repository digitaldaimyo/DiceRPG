<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dicebound — Combat Test</title>
<style>
:root{--bg:#13151b;--panel:#1c2029;--panel2:#262b37;--ink:#eeece6;--muted:#9aa1ae;--line:#323949;
--atk:#e0533d;--blk:#4f8fd6;--mag:#9b6cf0;--coin:#e2b23a;--good:#4fbf7a;--hp:#d9483b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.app{max-width:520px;margin:0 auto;padding:6px 10px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:6px;padding:4px 0 8px}
header h1{font-size:16px;margin:0;flex:1;letter-spacing:.4px}
header h1 small{display:block;color:var(--muted);font-weight:400;font-size:11px}
section{display:none}section.on{display:block}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary{background:var(--coin);color:#1b1407;border-color:var(--coin)}
.btn.icon{padding:7px 9px;font-size:13px;min-width:38px}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;margin-top:8px}.btnrow .btn{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
h2.scr{font-size:19px;margin:6px 0 2px}
p.sub{color:var(--muted);font-size:13px;margin:0 0 10px;line-height:1.45}
.muted{color:var(--muted)}

/* run bar */
.runbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.rb-top{display:flex;gap:10px;align-items:center;font-size:13px}
.rb-top .lv{flex:1;font-weight:700}
.rb-top b{font-weight:800}
.track{display:flex;gap:3px;margin-top:7px}
.tk{flex:1;height:26px;border-radius:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid transparent}
.tk.done{opacity:.3}.tk.cur{border-color:var(--coin);background:#3a3220}
.tk.elite{background:#3d2329}.tk.boss{background:#47301b}.tk.camp{background:#20352a}.tk.event{background:#262a45}

/* draft cards */
.steps{display:flex;gap:6px;margin:8px 0 10px}
.steps span{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:8px;background:var(--panel2);color:var(--muted)}
.steps span.on{background:#3a3220;color:var(--coin)}.steps span.done{color:var(--good)}
.dcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:12px;padding:10px 12px;color:var(--ink);font-family:inherit;cursor:pointer;margin-bottom:8px}
.dcard:disabled{opacity:.42;cursor:default}
.dc-top{display:flex;gap:10px;align-items:center}
.dc-ic{font-size:27px;width:36px;text-align:center;flex:none}
.dc-name{font-weight:750;font-size:15px}
.dc-type{font-size:11px;color:var(--rc);font-weight:700;letter-spacing:.2px}
.dc-body{font-size:13px;margin-top:6px;line-height:1.42}
.dc-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.tdoll{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.tslot{min-height:74px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;color:var(--ink);font-family:inherit;cursor:pointer;text-align:center}
.tslot .ic{font-size:22px}.tslot .nm{font-size:10.5px;font-weight:700;line-height:1.2;margin-top:2px}.tslot .sl{font-size:9.5px;color:var(--muted)}
.tslot .rn{font-size:9.5px;color:#8fd0ff}
.tslot.ok{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin),0 0 12px rgba(226,178,58,.3)}
.tslot.no{opacity:.32;cursor:default}
.tslot.empty{background:transparent;border-style:dashed}

/* combat */
.portrait{width:58px;height:58px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
.name{font-weight:700;font-size:15px;margin-bottom:5px;line-height:1.2}
.name small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:1px}
.hpbar{position:relative;height:16px;background:#2b1a1a;border-radius:8px;overflow:hidden}
.hpbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b8352a,#e0604f);transition:width .35s ease}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;min-height:20px}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.chip.block{color:#9cc4f2;border-color:#355a85}
.intent{flex:none;text-align:center;background:#2a2230;border:1px solid #4a3a52;border-radius:12px;padding:6px 8px;min-width:78px;font-size:13px;font-weight:700;line-height:1.5}
.intent small{display:block;font-size:9.5px;color:var(--muted);font-weight:600;letter-spacing:.8px}
.edice{display:flex;gap:6px;min-height:30px;margin-top:8px;padding-left:2px;align-items:center}
.edice .lbl{font-size:10px;color:var(--muted);margin-right:2px}
.erow{display:grid;gap:6px}
.ecard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px;cursor:pointer;position:relative;min-width:0;transition:opacity .3s}
.ecard.tgt{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.ecard.tgt::after{content:'🎯';position:absolute;top:-9px;right:-5px;font-size:14px}
.ecard.acting{border-color:#ff6b57;box-shadow:0 0 0 1px #ff6b57}
.ecard.dead{opacity:.25;filter:grayscale(1);cursor:default}
.etop{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.eic{font-size:30px;line-height:1.1;display:inline-block}
.erow.one .eic{font-size:42px}
.eint{font-size:11.5px;font-weight:750;text-align:right;line-height:1.35;background:#2a2230;border:1px solid #4a3a52;border-radius:8px;padding:3px 6px;min-width:0}
.erow.one .eint{font-size:13px;padding:5px 9px}
.enm{font-size:12.5px;font-weight:700;margin:5px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecard .hpbar{height:14px}.ecard .hpbar span{font-size:10px}
.ecard .chips{min-height:0;margin-top:4px}.ecard .chip{font-size:10px;padding:1px 5px}
.table{position:relative;margin:10px 0 6px;border-radius:16px;background:radial-gradient(120% 90% at 50% 40%,#24493a 0%,#1a3429 60%,#142a21 100%);box-shadow:inset 0 0 0 2px #0d1d16,inset 0 6px 22px rgba(0,0,0,.45);transition:height .2s}
.lane{position:absolute;left:0;right:0;height:60px;border-top:1px dashed rgba(255,255,255,.07)}
.lane:first-child{border-top:none}
.lane .lbl{position:absolute;left:6px;top:7px;width:52px;text-align:center}
.lane .lbl b{display:block;font-size:9.5px;letter-spacing:1.2px;color:var(--pc)}
.lane .lbl .tot{display:block;font-size:21px;font-weight:800;line-height:1.1}
.lane .lbl em{display:block;font-size:9px;color:#b9c4bd;font-style:normal;white-space:nowrap}
.die{position:absolute;width:46px;height:46px;cursor:pointer;z-index:2;transition:left .25s ease,top .25s ease;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4));--c:#888}
.die .sh{position:absolute;inset:0;background:linear-gradient(150deg,color-mix(in srgb,var(--c),#fff 28%) 0%,var(--c) 50%,color-mix(in srgb,var(--c),#000 30%) 100%);clip-path:var(--clip,none)}
.die .f{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:850;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none}
.die .sz{position:absolute;right:-3px;bottom:-7px;font-size:9px;color:#c8d3cc;font-style:normal;font-weight:700}
.die .kw{position:absolute;left:-5px;top:-7px;font-size:10px;background:rgba(10,12,16,.85);border-radius:8px;padding:0 4px;color:#ffe9a8;line-height:15px}
.die.s2 .sh{border-radius:50%}
.die.s4{--clip:polygon(50% 2%,99% 95%,1% 95%)}.die.s4 .f{padding-top:13px;font-size:16px}
.die.s6 .sh{border-radius:10px}
.die.s8{--clip:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.die.s12{--clip:polygon(50% 0,100% 37%,81% 100%,19% 100%,0 37%)}.die.s12 .f{padding-top:4px}
.die.s20{--clip:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)}
.p-atk{--c:var(--atk)}.p-blk{--c:var(--blk)}.p-mag{--c:var(--mag)}.p-coin{--c:var(--coin)}
.p-eatk{--c:#9c6b55}.p-eblk{--c:#5d6b80}.p-ev{--c:#c9a24a}
.die.max .f{color:#fff6cf}
.die.crit{--c:#f2c230;filter:drop-shadow(0 0 8px #ffd34d) drop-shadow(0 3px 0 rgba(0,0,0,.4))}.die.crit .f{color:#3a2a00;text-shadow:none}
.die.sel{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 5px #fff) drop-shadow(0 0 2px #fff);z-index:5}
.die.mini{position:relative;width:30px;height:30px;cursor:default}
.die.mini .f{font-size:13px}.die.mini.s4 .f{padding-top:8px;font-size:11px}
.die.big{position:relative;width:84px;height:84px;cursor:default}.die.big .f{font-size:32px}
.preview{font-size:12.5px;color:#cfd4dc;min-height:34px;line-height:1.45;padding:0 2px}
.preview b{color:#fff}
.hint{font-size:12px;color:var(--muted);min-height:18px;padding:2px 2px 6px}
.abilities{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.ab{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px;color:var(--ink);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px}
.ab .ai{font-size:18px}.ab .an{font-size:11px;font-weight:700;text-align:center;line-height:1.15}.ab .ar{font-size:9.5px;color:var(--muted)}
.ab.ready{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin),0 0 14px rgba(226,178,58,.35)}
.ab.used{opacity:.35}
.doll{display:grid;grid-template-columns:repeat(3,52px);gap:5px;flex:none}
.slot{height:52px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot .ic{font-size:21px;line-height:1}
.slot .dl{font-size:9.5px;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap}
.c-atk{color:#ff8f7d!important}.c-blk{color:#8ebcf0!important}.c-mag{color:#c5a7ff!important}.c-coin{color:#f1cf73!important}
.slot.empty{background:transparent;border-style:dashed;cursor:default}
.slot.empty .el{font-size:9px;color:#5d6678;text-align:center}
.slot.two{opacity:.6}
.slot .rdot{position:absolute;top:3px;right:4px;font-size:8px;color:#8fd0ff}
.stats{font-size:11.5px;color:#cfd4dc;margin-top:6px;line-height:1.55}
.stats b{color:#fff}.stats span.n{white-space:nowrap;margin-right:6px}.stats .d{color:var(--muted)}
.actionbar{position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(19,21,27,0),var(--bg) 22%);padding:14px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.actionbar .btn{flex:1;padding:12px 8px;font-size:15px}
details{margin:10px 0 4px;font-size:12px;color:var(--muted)}
summary{cursor:pointer;padding:4px 0}
#log{margin:4px 0 0;padding-left:18px;max-height:220px;overflow:auto;line-height:1.5}
#log li.t{list-style:none;margin-left:-18px;color:#cfd4dc;font-weight:700;margin-top:4px}

/* event / camp / reward / end */
.bigicon{font-size:52px;text-align:center;margin-top:6px}
.center{text-align:center}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font-family:inherit;cursor:pointer;margin-bottom:8px;font-size:14px;font-weight:650}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px}
.opt:disabled{opacity:.4;cursor:default}
.felt{border-radius:16px;background:radial-gradient(120% 90% at 50% 40%,#24493a 0%,#1a3429 60%,#142a21 100%);box-shadow:inset 0 0 0 2px #0d1d16,inset 0 6px 22px rgba(0,0,0,.45);height:130px;display:flex;align-items:center;justify-content:center;margin:10px 0;gap:14px}
.felt .math{font-size:22px;font-weight:800}
.result{font-size:14px;line-height:1.5;margin:8px 0}
.result.win{color:#8fe3ad}.result.lose{color:#ff9a8a}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bag{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.bag .ic{font-size:24px;width:32px;text-align:center}
.bag .t{flex:1;font-size:13px;line-height:1.35}.bag .t small{color:var(--muted);display:block;font-size:11.5px}
.list{font-size:13px;line-height:1.6;color:#cfd4dc}
.detail{font-size:12.5px;color:#cfd4dc;line-height:1.45;min-height:36px;margin:4px 0 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3040;border:1px solid var(--line);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:80;max-width:90%;text-align:center}

/* town */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 7px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px;padding:6px 4px;border-radius:14px;background:transparent;border:1px dashed #4a5263;color:var(--muted);font-family:inherit;cursor:pointer;text-align:center}
.tile .ic{font-size:28px;filter:grayscale(1);opacity:.45}.tile .nm{font-size:11.5px;font-weight:700}.tile .pips{font-size:10px;letter-spacing:2px;color:var(--coin)}.tile .cost{font-size:10.5px}
.tile.built{background:var(--panel);border:1px solid var(--line);color:var(--ink)}.tile.built .ic{filter:none;opacity:1}
.tile.afford{border-color:var(--coin);border-style:solid}.tile.sel{box-shadow:0 0 0 2px var(--coin)}
.tile.gate{min-height:0;flex-direction:row;gap:10px;padding:10px 12px;cursor:default}
.opt.on{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
h3.ph{font-size:13px;margin:16px 0 6px;color:#cfd4dc}
.sp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px}.sp span{display:block;font-size:20px;font-weight:800}.sp .btn{padding:4px 8px;min-width:0;margin:2px 1px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pop{position:fixed;font-weight:850;font-size:15px;white-space:nowrap;text-shadow:0 2px 3px rgba(0,0,0,.8),0 0 2px #000}
.pop.big{font-size:24px}
.ring{position:fixed;width:46px;height:46px;border-radius:50%;border:3px solid #ffd36b}
.flash{position:fixed;inset:0;background:#fff3c4}
/* ===== DICEBOUND : ENCHANTED TABLETOP VISUAL PASS ===== */
:root{--bg:#0b1017;--panel:#171e29;--panel2:#222c39;--ink:#f5eddb;--muted:#a5adbb;--line:#384453;--atk:#e96951;--blk:#5c9ee6;--mag:#b28af5;--coin:#efc66b;--good:#78dba1;--hp:#e65a52}
html{background:#0b1017}
body{min-height:100vh;background:radial-gradient(ellipse 90% 33% at 50% -3%,rgba(164,121,58,.19),transparent 80%),radial-gradient(ellipse 70% 45% at 95% 65%,rgba(30,73,68,.12),transparent 85%),#0b1017;color:var(--ink)}
.app{max-width:550px;padding:10px 13px calc(34px + env(safe-area-inset-bottom))}
header{padding:9px 2px 15px;border-bottom:1px solid rgba(239,198,107,.18);margin-bottom:13px}
header h1{font-family:Georgia,serif;font-size:25px;font-weight:700;letter-spacing:.5px;color:#f8dfa4;text-shadow:0 2px 14px rgba(226,178,58,.13)}
header h1 small{font-family:system-ui,sans-serif;letter-spacing:1.4px;text-transform:uppercase;font-size:9px;margin-top:3px;color:#a5a9b2}
.btn{border-radius:10px;border:1px solid #4b5665;background:linear-gradient(#303b49,#242c39);box-shadow:inset 0 1px rgba(255,255,255,.06),0 2px 5px rgba(0,0,0,.18);transition:filter .12s,transform .12s,border-color .12s}
.btn:not(:disabled):active,.dcard:active,.opt:active{transform:scale(.985)}
.btn:not(:disabled):hover{filter:brightness(1.12);border-color:#bda36d}
.btn.primary{background:linear-gradient(155deg,#ffe3a0,#d5a34d);border-color:#f7d58c;color:#30220d;box-shadow:0 3px 14px rgba(207,153,63,.18),inset 0 1px rgba(255,255,255,.35)}
.card,.runbar{background:linear-gradient(155deg,#202937,#141b25 78%);border:1px solid #405064;box-shadow:0 5px 22px rgba(0,0,0,.23),inset 0 1px rgba(255,255,255,.045)}
h2.scr{font-family:Georgia,serif;font-size:23px;color:#f4d99e;margin:10px 0 6px}
p.sub{line-height:1.55}
.runbar{padding:11px 12px;margin-bottom:14px;border-color:#5b4e3a}
.rb-top .lv{color:#f0d9aa;letter-spacing:.3px}
.track{gap:4px;margin-top:10px}.tk{height:24px;background:#26313c;border-radius:5px;font-size:12px}.tk.cur{border-color:#f6d078;background:#55452b;box-shadow:0 0 10px rgba(240,194,92,.25)}.tk.done{opacity:.35}
.steps span{border:1px solid #354251;padding:9px 4px}.steps span.on{border-color:#ba914c;background:#473821;color:#ffe3a0}
.dcard{background:linear-gradient(130deg,#222c3a,#171f2b);border-color:#3a4756;border-left-width:4px;padding:14px 13px;box-shadow:0 3px 11px rgba(0,0,0,.2);transition:transform .12s,border-color .12s,background .12s}
.dcard:hover{border-color:#c5a565;background:linear-gradient(130deg,#293648,#1c2532)}
.dc-ic{font-size:32px;width:43px;filter:drop-shadow(0 2px 5px #0007)}.dc-name{font-size:16px}.dc-type{letter-spacing:.5px}.dc-body{font-size:13px;color:#e7e6e1}
.table,.felt{background:radial-gradient(ellipse at 50% 42%,#245144 0%,#173c32 58%,#102a25 100%);border:3px solid #57452d;box-shadow:0 0 0 1px #a88a55,inset 0 0 0 2px #10231d,inset 0 8px 35px #061a15,0 10px 26px #0008;overflow:visible}
.table:before{content:'';position:absolute;inset:5px;border:1px solid rgba(224,198,131,.11);border-radius:10px;pointer-events:none}
.lane{border-top:1px dashed rgba(222,216,187,.13)}.lane .lbl{left:8px;top:8px;width:51px}.lane .lbl b{font-size:9px;letter-spacing:1.1px}.lane .lbl .tot{font-family:Georgia,serif;font-size:23px;color:#fff4dc;text-shadow:0 1px 5px #000}.lane .lbl em{font-size:9px}
.die{filter:drop-shadow(0 4px 1px rgba(0,0,0,.48)) drop-shadow(0 1px 5px rgba(0,0,0,.28));transition:left .25s ease,top .25s ease,filter .18s;touch-action:manipulation}
.die .sh{background:linear-gradient(145deg,color-mix(in srgb,var(--c),#fff 42%) 0%,color-mix(in srgb,var(--c),#fff 10%) 28%,var(--c) 48%,color-mix(in srgb,var(--c),#000 45%) 100%);border:1px solid rgba(255,255,255,.28);box-shadow:inset 2px 2px 5px rgba(255,255,255,.21),inset -3px -4px 8px rgba(0,0,0,.24)}
.die .sh:after{content:'';position:absolute;inset:5px;clip-path:inherit;border-top:1px solid rgba(255,255,255,.27);opacity:.8}
.die .f{font-family:Georgia,serif;font-weight:900;font-size:22px;text-shadow:0 2px 3px #0009}.die .sz{color:#e1e9e4;text-shadow:0 1px 3px #000}.die .kw{border:1px solid #ae9156;background:#24202a;color:#ffe7a1;font-weight:800;box-shadow:0 2px 6px #0008}
.die.max{filter:drop-shadow(0 0 7px rgba(255,220,127,.65)) drop-shadow(0 4px 1px #0008)}
.die.crit{filter:drop-shadow(0 0 10px #ffd34d) drop-shadow(0 0 20px #ffba31)}
.die.sel{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 11px #ffdf9c);z-index:8}

<script>
"use strict";
const $=id=>document.getElementById(id);

/* ================= RNG =================
   Run RNG (map, drafts, enemies, events) keeps its state in the save.
   Each fight gets its own seed, so a reloaded fight replays identically. */
let RS=1;
function rnd(){RS|=0;RS=RS+0x6D2B79F5|0;let t=Math.imul(RS^RS>>>15,1|RS);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
const ri=n=>1+Math.floor(rng()*n);
const rpick=a=>a[Math.floor(rnd()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ================= content ================= */
const KW={
  exploding:{g:'✸',n:'Exploding',t:'max roll rolls again and adds'},
  heavy:{g:'▼',n:'Heavy',t:'rolls of 1–2 count as 3'},
  lucky:{g:'♣',n:'Lucky',t:'a 1 is rerolled once for free'},
  blessed:{g:'✚',n:'Blessed',t:'+1 to the die'},
  twin:{g:'∞',n:'Twin',t:'matching pairs in the pool add again'},
  burning:{g:'♨',n:'Burning',t:'max roll applies Burn 2'},
  vampiric:{g:'♥',n:'Vampiric',t:'max roll heals 1'},
  piercing:{g:'➶',n:'Piercing',t:'this attack die ignores block'},
  splash:{g:'✺',n:'Splash',t:'max roll also hits another enemy'}
};
const STI={poison:{i:'☠',n:'Poison',c:'#9be36b'},burn:{i:'♨',n:'Burn',c:'#ff9b5e'},weak:{i:'↓',n:'Weak',c:'#f0a35e'},
  vuln:{i:'◎',n:'Vulnerable',c:'#ff7fa8'},stun:{i:'✦',n:'Stun',c:'#ffffff'},ward:{i:'✧',n:'Ward',c:'#bfe8ff'}};
const DEBUFF=['poison','burn','weak','vuln','stun'];
const POOLS=['atk','blk','mag','coin'];
const POOLNAME={atk:'ATTACK',blk:'BLOCK',mag:'MAGIC',coin:'COINS'};
const POOLWORD={atk:'attack',blk:'block',mag:'magic',coin:'coin'};
const SLOTS=[['j1','Ring'],['helm','Helmet'],['j2','Ring'],['rh','Right hand'],['chest','Chest'],['lh','Left hand'],['cape','Cape'],['legs','Legs'],['feet','Feet']];
const SLOTNAME={j1:'Ring 1',j2:'Ring 2',ring:'Ring',helm:'Helmet',rh:'Right hand',chest:'Chest',lh:'Left hand',cape:'Cape',legs:'Legs',feet:'Feet'};
const STATS=['STR','DEX','INT','VIT','LCK'];

function mkItem(id){const g=G[id];return{id,slot:g.slot,r:g.r,name:g.name,icon:g.icon,dice:g.dice.map(d=>({sides:d.sides,pool:d.pool,kw:[...d.kw]})),stats:g.stats?{...g.stats}:null,coin:g.coin?{...g.coin}:null,two:!!g.two,imbues:[],step:0}}
function newRun(p){
  p=p||{weapon:'rusty',alloc:{},trait:null,ability:null,rune:null};
  const seed=1+Math.floor(Math.random()*999999);RS=seed;
  const base={STR:2,DEX:2,INT:2,VIT:2,LCK:2};for(const k in p.alloc)base[k]+=p.alloc[k];

  const runes={};if(p.rune)runes[RUNE_FIXED[p.rune]||p.runeSlot||'rh']=[p.rune];
  run={v:3,seed,endless:!!p.endless,won:false,level:1,enc:0,map:genMap(),gold:0,tokens:1+BL('shrine'),eliteBonus:false,
    events:shuffle(Object.keys(EVENTS)).slice(0,6),eventsDone:0,bonus:[],
    hero:{base,hp:20+5*base.VIT,items:{rh:weapon,lh:mkItem(BL('smith')>=2?'buckler':'plank'),chest:mkItem('tunic')},runes,abilities:p.ability?[p.ability]:[],traits:p.trait?[p.trait]:[],potions:BL('apoth')?2:1,potHeal:BL('apoth')>=2?12:8,bagMax:4+BL('tailor'),backpack:[]},
    phase:'draft',draft:null,fight:null,event:null,reward:null,stats:{won:0,cards:0}};
  startDraft('main');
  showCinematic('arrival',1);
}
function genMap(){const mid=shuffle(['fight','fight','fight','fight','fight','fight','fight','event','event']);return[...mid.slice(0,5),'elite',...mid.slice(5),'elite','camp','boss']}
function startLevel(n){run.level=n;run.enc=0;run.map=genMap();run.eliteBonus=false;
  if(run.events.length<n*2)run.events.push(...shuffle(Object.keys(EVENTS)).slice(0,2));
  startDraft('main');showCinematic('arrival',n)}
function markWin(){if(run.won)return;run.won=true;run.gold+=100;town.stats.wins++;saveTown();save()}
const H=()=>run.hero;
function totals(h=H()){const s={...h.base};for(const k in h.items){const it=h.items[k];if(it&&it.stats)for(const x in it.stats)s[x]+=it.stats[x]}return s}
const maxHp=(h=H())=>20+5*totals(h).VIT;
function withHp(fn){const b=maxHp();fn();const a=maxHp();if(a>b)H().hp+=a-b;H().hp=Math.min(H().hp,a)}
const stepN=(s,n)=>{for(let i=0;i<n;i++)s=STEP[s];return s};
function itemKws(it){return[...new Set([...it.dice.flatMap(d=>d.kw),...it.imbues])]}

/* ================= text helpers ================= */
function diceText(dice,step=0,extraKw=[]){
  const by={};dice.forEach(d=>{const s=d.pool==='coin'?2:stepN(d.sides,step);(by[d.pool]=by[d.pool]||[]).push(s)});
  return Object.keys(by).map(p=>p==='coin'?'1 coin':`${fmtDice(by[p])} ${POOLWORD[p]}`).join(' + ');
}
function fmtDice(arr){const c={};arr.forEach(s=>c[s]=(c[s]||0)+1);return Object.keys(c).sort((a,b)=>b-a).map(s=>`${c[s]>1?c[s]:''}d${s}`).join('+')}
function itemDesc(it,inst){
  const parts=[];
  if(it.dice.length)parts.push(diceText(it.dice,inst?it.step:0));
  const kws=inst?itemKws(it):[...new Set(it.dice.flatMap(d=>d.kw))];
  kws.forEach(k=>parts.push(`${KW[k].g} ${KW[k].n}`));
  if(it.stats)for(const k in it.stats)parts.push(`+${it.stats[k]} ${k}`);
  if(it.coin)parts.push(COINTXT[it.coin.type](it.coin.n));
  if(it.two)parts.push('two-handed');
  return parts.join(' · ')||'no effect';
}
function itemShort(it){if(!it)return'';if(it.ref)return'';const d=it.dice.length?diceText(it.dice,it.step):'';return d||Object.keys(it.stats||{}).map(k=>`+${it.stats[k]} ${k}`).join(' ')}
function cardInfo(c){
  const h=H();
  if(c.gear){const g=G[c.gear];let sub='';
    if(g.slot==='ring'){const a=h.items.j1,b=h.items.j2;sub=!a||!b?'Fills an empty ring slot.':`Replaces ${a.name} or ${b.name} (you choose).`}
    else if(g.two){const r=h.items.rh,l=h.items.lh;const names=[r,l].filter(x=>x&&!x.ref).map(x=>x.name);sub=names.length?`Uses both hands. Replaces ${names.join(' and ')}.`:'Uses both hands.'}
    else{const cur=h.items[g.slot];if(cur&&cur.ref)sub=`Replaces your two-handed ${h.items.rh.name}.`;else if(cur&&g.slot==='rh'&&cur.two)sub=`Replaces your two-handed ${cur.name}.`;else sub=cur?`Replaces ${cur.name} (${itemShort(cur)||'no dice'}).`:'Fills an empty slot.'}
    return{icon:g.icon,name:g.name,type:`Gear · ${SLOTNAME[g.slot]}`,body:itemDesc(g),sub};}
  if(c.imbue){const k=KW[c.imbue];return{icon:'✨',name:IMBUES[c.imbue].name,type:'Imbue · goes on one item',body:`That item's dice gain ${k.g} ${k.n}: ${k.t}.`,sub:'Leaves with the item if you swap it. Max 2 per item.'}}
  if(c.rune){const R=RUNES[c.rune];return{icon:'🔷',name:R.name,type:`Rune · ${R.slots?R.slots.map(s=>SLOTNAME[s]).join('/'):'any slot'}`,body:R.desc[0].toUpperCase()+R.desc.slice(1)+'.',sub:'Stays on the slot when you swap gear. Max 2 per slot.'}}
  if(c.hone)return{icon:'⚒️',name:'Hone',type:'Upgrade · one item',body:"One item's dice grow a size: d2→d4→d6→d8→d12.",sub:'Stays with the item.'};
  if(c.stat)return{icon:STATICON[c.stat],name:`+${c.n} ${c.stat}`,type:'Stat',body:STATDESC[c.stat]+'.',sub:`You have ${totals()[c.stat]} ${c.stat}.`};
  if(c.potion)return{icon:'🧪',name:'Healing Potion',type:'Supply',body:`+1 potion. Heals ${h.potHeal||8}, free to use once per turn in combat.`,sub:`You carry ${h.potions}.`};
  if(c.ability){const a=ABIL[c.ability];return{icon:a.icon,name:a.name,type:'Ability',body:`Spend a die showing ${a.req}: ${a.desc}. Cooldown ${a.cd} turn${a.cd>1?'s':''}.`,sub:`You hold ${h.abilities.length} of 3 abilities.`}}
  if(c.trait){const t=TRAITS[c.trait];return{icon:t.icon,name:t.name,type:'Trait · passive',body:t.desc,sub:''}}
}

/* ================= draft ================= */
function available(c){
  const h=H();if((c.lib||0)>BL('library'))return false;
  if(c.gear){const g=G[c.gear];if(g.slot==='ring')return!((h.items.j1&&h.items.j1.id===g.id)&&(h.items.j2&&h.items.j2.id===g.id));const cur=h.items[g.slot];return!(cur&&cur.id===g.id)}
  if(c.ability)return!h.abilities.includes(c.ability)&&h.abilities.length<3;
  if(c.trait)return!h.traits.includes(c.trait);
  if(c.potion)return h.potions<3;
  if(c.imbue||c.hone||c.rune)return SLOTS.some(([s])=>validTarget(c,s));
  return true;
}
function rollRarity(min){const o=RODDS[Math.min(2,run.level-1)];let x=rnd()*100,r='c';for(let i=0;i<4;i++){if(x<o[i]){r=RORDER[i];break}x-=o[i]}if(min&&RORDER.indexOf(r)<RORDER.indexOf(min))r=min;return r}
function genSet(kind,minFirst){
  if(kind==='legend'){const pool=shuffle(CARDS.filter(c=>c.r==='l'&&available(c)));return pool.slice(0,3).map(c=>c.id)}
  const pool=CARDS.filter(c=>c.kind===kind&&c.r!=='l'&&available(c));const out=[];
  for(let i=0;i<3;i++){
    const want=rollRarity(i===0?minFirst:null);let k=RORDER.indexOf(want);let cand=[];
    while(k>=0&&!cand.length){cand=pool.filter(c=>c.r===RORDER[k]&&!out.includes(c));k--}
    if(!cand.length)cand=pool.filter(c=>!out.includes(c));
    if(!cand.length)break;
    out.push(cand[Math.floor(rnd()*cand.length)]);
  }
  return out.map(c=>c.id);
}
const STEPNAME={gear:'Gear',forge:'Forge',growth:'Growth',legend:'Legendary'};
function startDraft(kind,opt={}){
  if(kind==='main'&&['fight','elite','boss'].includes(run.map[run.enc])&&!run.nextFight)run.nextFight=genFight(run.map[run.enc]);
  run.draft={kind,steps:kind==='main'?['gear','forge','growth']:kind==='legend'?['legend']:[opt.pool],step:0,minR:opt.minR||null,cards:[]};
  genCards();run.phase='draft';save();renderDraft();show('draft');
}
function genCards(){const d=run.draft;const pool=d.steps[d.step];let min=null;
  if(d.kind==='main'&&pool==='gear'&&run.eliteBonus)min='r';if(d.kind==='bonus')min=d.minR;d.cards=genSet(pool,min)}
function draftFlavor(kind){return {gear:['⚔️','THE TREASURE TABLE','Choose the next piece of your machine.'],forge:['⚒️','THE ENCHANTER’S WORKBENCH','Bind power to an item or to its equipment slot.'],growth:['✨','THE ASCENSION ALTAR','Refine the adventurer behind the engine.'],legend:['👑','THE BOSS’S HOARD','One legendary treasure. Choose well.']}[kind]||['🎁','A GIFT FROM THE DEPTHS','Claim your reward.']}
function draftSynergy(c){
  const h=H();
  if(c.rune){const count=SLOTS.filter(([s])=>validTarget(c,s)).reduce((n,[s])=>n+((h.items[s]&&h.items[s].dice)?h.items[s].dice.filter(d=>d.pool!=='coin').length:0),0);return count&&RUNES[c.rune].kw||RUNES[c.rune].grow||c.rune==='growth'?(count?`✦ Can empower up to ${count} equipped dice`:''):''}
  if(c.imbue){const best=Math.max(0,...Object.values(h.items).filter(x=>x&&!x.ref&&x.dice&&x.imbues.length<2).map(x=>x.dice.filter(d=>d.pool!=='coin').length));return best?`✦ Best target has ${best} ${best===1?'die':'dice'}`:''}
  if(c.gear){const g=G[c.gear];if(g.slot==='ring'||g.two)return '';const old=h.items[g.slot];const nw=g.dice.length,od=old&&old.dice?old.dice.length:0;return nw!==od?`✦ ${nw>od?'+':''}${nw-od} ${Math.abs(nw-od)===1?'die':'dice'} in this slot`:''}
  return '';
}
function renderDraft(){
  const d=run.draft;if(!d)return;const el=$('scr-draft');const nxt=run.map[run.enc];
  let h='';const kind=d.steps[d.step],fl=draftFlavor(kind);el.className='on theme-'+kind;const stage=`<div class="draft-stage"><span class="stage-icon">${fl[0]}</span><strong>${fl[1]}</strong><p>${fl[2]}</p></div>`;
  if(d.kind==='main'&&run.enc===0&&d.step===0)h+=`<div class="card" style="margin-bottom:10px"><div class="list"><b>${LV().icon} ${levelTitle()}</b><br>${loopOf()?`Endless loop ${loopOf()}: enemies have more HP, dice ${loopOf()} size${loopOf()>1?'s':''} bigger, and gold pays ${25*loopOf()}% more.`:LV().intro}</div></div>`;
  h+=stage;
  if(d.kind==='main')h+=`<h2 class="scr">Prepare for ${ENC[nxt].i} ${ENC[nxt].n}</h2><p class="sub">${run.level>3?'Depth':'Level'} ${run.level} · encounter ${run.enc+1} of 13${nxt==='boss'?` · ${ENEMIES[LV().boss].name} awaits`:''}${run.eliteBonus&&d.steps[d.step]==='gear'?' · Elite bonus: a Rare is guaranteed':''}${BL('watch')&&run.nextFight?`<br>🔭 Scouted: ${fightName(run.nextFight)}`:''}${BL('watch')>=2&&nxt==='event'?`<br>🔭 Ahead: ${EVENTS[eventAt(run.enc)].icon} ${EVENTS[eventAt(run.enc)].name}`:''}</p>
    <div class="steps">${d.steps.map((s,i)=>`<span class="${i===d.step?'on':i<d.step?'done':''}">${i<d.step?'✓ ':''}${STEPNAME[s]}</span>`).join('')}</div>`;
  else if(d.kind==='legend')h+=`<h2 class="scr">👑 Boss reward: Legendary pick</h2><p class="sub">Take one. Next: ${levelTitle(run.level+1)}.</p>`;
  else h+=`<h2 class="scr">Bonus pick: ${STEPNAME[d.steps[0]]}</h2><p class="sub">A reward from the event.</p>`;
  if(targetMode){const c=targetMode.card,ci=cardInfo(c);
    h+=`<p class="sub" style="color:var(--ink)">Choose ${c.rune?'a slot':c.gear?'a ring to replace':'an item'} for <b>${ci.name}</b>.</p>${targetDoll(c)}<button class="btn wide" id="tCancel">Back to the cards</button>`;
    el.innerHTML=h;
    el.querySelectorAll('.tslot.ok').forEach(b=>b.onclick=()=>{const card=targetMode.card;targetMode=null;applyCard(card,b.dataset.s);nextStep()});
    $('tCancel').onclick=()=>{targetMode=null;renderDraft()};return;}
  h+=d.cards.map((id,i)=>{const c=CARD[id],ci=cardInfo(c),syn=draftSynergy(c);return `<button class="dcard" style="--rc:${RAR[c.r].c}" data-r="${c.r}" data-i="${i}"><div class="dc-top"><span class="dc-ic">${ci.icon}</span><div><div class="dc-name">${ci.name}</div><div class="dc-type">${ci.type} · ${RAR[c.r].n}</div></div></div><div class="dc-body">${ci.body}</div>${ci.sub?`<div class="dc-sub">${ci.sub}</div>`:''}${syn?`<div class="synergy">${syn}</div>`:''}</button>`}).join('');
  if(!d.cards.length)h+=`<p class="sub">No cards left in this pool.</p>`;
  h+=`<div class="btnrow"><button class="btn" id="dSkip">Skip (+5 gold)</button><button class="btn" id="dReroll" ${run.tokens>0?'':'disabled'}>↻ New cards (${run.tokens})</button></div>`;
  el.innerHTML=h;
  el.querySelectorAll('.dcard').forEach(b=>b.onclick=()=>pickCard(Number(b.dataset.i)));
  if(d.cards.length){sfx('reveal');if(d.cards.some(id=>['r','e','l'].includes(CARD[id].r)))setTimeout(()=>sfx('rare'),230)}
  $('dSkip').onclick=()=>{run.gold+=5;toast('+5 gold');nextStep()};
  $('dReroll').onclick=()=>{if(run.tokens<=0)return;sfx('reroll');run.tokens--;genCards();save();renderDraft()};
}
function needsTarget(c){const h=H();if(c.imbue||c.hone||c.rune)return true;if(c.gear&&G[c.gear].slot==='ring'&&h.items.j1&&h.items.j2)return true;return false}
function validTarget(c,s){
  const h=H(),it=h.items[s];
  if(c.gear)return s==='j1'||s==='j2';
  if(c.rune){const R=RUNES[c.rune];if(it&&it.ref)return false;return(!R.slots||R.slots.includes(s))&&(h.runes[s]||[]).length<2}
  if(!it||it.ref)return false;
  const real=it.dice.filter(d=>d.pool!=='coin');if(!real.length)return false;
  if(c.imbue)return it.imbues.length<2&&(c.imbue==='blessed'||!itemKws(it).includes(c.imbue));
  if(c.hone)return real.some(d=>stepN(d.sides,it.step)<12);
  return false;
}
function itemMarks(it,s,h){if(!it||it.ref)return '';const marks=[...(it.imbues||[]).map(k=>`<span title="${KW[k].n}">${KW[k].g}</span>`),...(it.step?[`<span title="Honed ${it.step} times">+${it.step}</span>`]:[])];const rn=((h||H()).runes[s]||[]).length;return `${marks.length?`<span class="item-marks">${marks.join('')}</span>`:''}${rn?`<span class="rune-gems" title="Slot runes">${'◆'.repeat(rn)}</span>`:''}`}
function targetDoll(c,validFn,neutral){
  const h=H();validFn=validFn||(s=>validTarget(c,s));
  return `<div class="tdoll">${SLOTS.map(([s,label])=>{const it=h.items[s];const ok=validFn(s);const rn=(h.runes[s]||[]).map(r=>RUNES[r].name.replace('Rune of ','')).join(', ');
    const main=it&&it.ref?h.items[it.ref]:it;
    return `<button style="--rar:${main?RAR[main.r].c:'#667181'}" ${main?`data-r="${main.r}"`:''} class="tslot ${neutral?'':ok?'ok':'no'} ${main?'':'empty'}" data-s="${s}" ${ok?'':'disabled'}><span class="ic">${main?main.icon:''}</span><span class="nm">${main?main.name:''}</span><span class="sl">${SLOTNAME[s]}${main&&!it.ref&&itemShort(main)?' · '+itemShort(main):''}</span>${main&&!it.ref?itemMarks(main,s,h):''}${rn?`<span class="rn">◆ ${rn}</span>`:''}</button>`}).join('')}</div>`;
}
function pickCard(i){
  sfx('select');const c=CARD[run.draft.cards[i]];if(!c)return;
  if(needsTarget(c)){targetMode={card:c};renderDraft();window.scrollTo(0,0);return}
  applyCard(c);nextStep();
}
function applyCard(c,slot){
  sfx(c.imbue||c.rune||c.hone?'forge':c.gear?'gear':c.stat||c.trait||c.ability?'growth':'coin');const h=H();run.stats.cards++;
  if(c.gear){const it=mkItem(c.gear);let s=it.slot;if(s==='ring')s=slot||(!h.items.j1?'j1':'j2');withHp(()=>equip(it,s));toast(`Equipped ${it.name}`)}
  else if(c.imbue){const it=h.items[slot];it.imbues.push(c.imbue);toast(`${it.name} gains ${KW[c.imbue].n}`)}
  else if(c.rune){(h.runes[slot]=h.runes[slot]||[]).push(c.rune);toast(`${RUNES[c.rune].name} on ${SLOTNAME[slot]}`)}
  else if(c.hone){const it=h.items[slot];it.step++;toast(`${it.name} honed: ${diceText(it.dice,it.step)}`)}
  else if(c.stat){withHp(()=>{h.base[c.stat]+=c.n});toast(`+${c.n} ${c.stat}`)}
  else if(c.potion){h.potions+=c.potion;toast('+1 potion')}
  else if(c.ability){h.abilities.push(c.ability);toast(`Learned ${ABIL[c.ability].name}`)}
  else if(c.trait){h.traits.push(c.trait);toast(`Trait: ${TRAITS[c.trait].name}`)}
}
function toBag(it){
  const h=H();if(!it||it.ref)return;
  if(h.backpack.length<(h.bagMax||4)){h.backpack.push(it)}else{const g=SCRAP[it.r]||2;run.gold+=g;toast(`Backpack full: ${it.name} scrapped for ${g} gold`)}
}
function equip(it,s){
  const h=H();
  if(it.two){toBag(h.items.rh);if(h.items.lh&&!h.items.lh.ref)toBag(h.items.lh);h.items.rh=it;h.items.lh={ref:'rh'};return}
  if(s==='lh'&&h.items.lh&&h.items.lh.ref){toBag(h.items.rh);h.items.rh=null;h.items.lh=it;return}
  if(s==='rh'&&h.items.rh&&h.items.rh.two){toBag(h.items.rh);h.items.lh=null;h.items.rh=it;return}
  toBag(h.items[s]);h.items[s]=it;
}
function nextStep(){
  const d=run.draft;
  if(d.kind==='main'&&d.steps[d.step]==='gear')run.eliteBonus=false;
  d.step++;
  if(d.step>=d.steps.length){run.draft=null;if(d.kind==='main')enterEncounter();else if(d.kind==='legend')startLevel(run.level+1);else afterBonus();return}
  genCards();save();renderDraft();window.scrollTo(0,0);
}

/* ================= encounters ================= */
function genFight(t){
  const L=LV();const ids=t==='boss'?[L.boss]:rpick(t==='elite'?L.elite:run.enc<4?L.early:L.mid).slice();
  const loop=loopOf(),th=(run.level-1)%3;
  /* deeper loops: themes are lifted to Spire strength, then +35% HP, +4 damage and one die size per loop */
  const lv=loop?[2.1,1.35,1][th]*1.45*Math.pow(1.35,loop):[1,1.3,1.45][run.level-1];
  const boss=loop?[3,1.8,1][th]*Math.pow(1.35,loop):1;
  return{ids,seed:1+Math.floor(rnd()*1e9),scale:(t==='boss'?boss:lv)*(1+0.08*run.enc),power:Math.floor((run.enc/3+(loop?8+4*loop:(run.level-1)*4))/ids.length),dstep:loop};
}
function eventAt(i){let k=0;for(let j=0;j<i;j++)if(run.map[j]==='event')k++;return run.events[((run.level-1)*2+k)%run.events.length]}
function enterEncounter(){
  const t=run.map[run.enc];
  if(t==='event'){run.event={id:run.events[run.eventsDone%run.events.length],res:null};run.phase='event';save();renderEvent();show('event');return}
  if(t==='camp'){run.phase='camp';run.camp=null;save();renderCamp();show('camp');return}
  run.fight=run.nextFight||genFight(t);run.nextFight=null;
  run.phase='combat';save();if(t==='boss')showCinematic('boss',run.level,()=>startCombat());else startCombat();
}
function completeEncounter(){
  run.enc++;
  if(run.enc>=run.map.length){
    if(run.level===3&&!run.endless){finishRun(true);return}
    if(run.level===3&&!run.won){markWin();toast('The Gearmind falls! +100 gold. The Spire goes deeper…')}
    if(CARDS.some(c=>c.r==='l'&&available(c)))startDraft('legend');else startLevel(run.level+1);
    return}
  startDraft('main');
}
function afterBonus(){if(run.bonus.length){startDraft('bonus',run.bonus.shift())}else completeEncounter()}

/* --- events --- */
function chance(stat,target){const s=totals()[stat];return Math.max(0,Math.min(1,(21-(target-s))/20))}
function renderEvent(){
  const e=EVENTS[run.event.id],el=$('scr-event');const h=H();
  let html=`<div class="bigicon">${e.icon}</div><h2 class="scr center">${e.name}</h2><p class="sub center">${e.text}</p>`;
  if(!run.event.res){
    html+=e.opts.map((o,i)=>{const dis=(o.need==='potion'&&h.potions<1)||(o.gold&&run.gold<o.gold);
      const cost=o.gold?`<small>Costs ${o.gold} gold (you have ${run.gold})</small>`:o.need==='potion'?`<small>Costs 1 potion (you have ${h.potions})</small>`:'';
      const ck=(o.check?`<small>d20 + ${o.check[0]} (${totals()[o.check[0]]}) vs ${o.check[1]} · ${Math.round(chance(o.check[0],o.check[1])*100)}% chance</small>`:'')+cost;
      return `<button class="opt" data-i="${i}" ${dis?'disabled':''}>${o.label}${ck}</button>`}).join('');
    html+=`<div class="felt" id="evFelt" style="display:none"></div>`;
    el.innerHTML=html;el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>chooseEvent(Number(b.dataset.i)));
  }else{
    const r=run.event.res;
    html+=r.roll?`<div class="felt"><div class="die big s20 p-ev"><div class="sh"></div><div class="f">${r.roll}</div></div><div class="math">+${r.stat} = ${r.roll+r.stat} <span style="color:${r.win?'#8fe3ad':'#ff9a8a'}">vs ${r.target}</span></div></div>`:'';
    html+=`<div class="result ${r.roll?(r.win?'win':'lose'):''}">${r.text}</div><div class="list">${r.fxText.join('<br>')}</div><div style="height:10px"></div><button class="btn primary wide" id="evNext">Continue</button>`;
    el.innerHTML=html;$('evNext').onclick=()=>{run.eventsDone++;run.event=null;afterBonus()};
  }
}
async function chooseEvent(i){
  const e=EVENTS[run.event.id],o=e.opts[i];
  $('scr-event').querySelectorAll('.opt').forEach(b=>b.disabled=true);
  let out,res={};
  if(o.check){
    const [stat,target]=o.check;const s=totals()[stat];const roll=1+Math.floor(rnd()*20);const win=roll+s>=target;
    out=win?o.win:o.lose;res={roll,stat:s,target,win};
    const felt=$('evFelt');felt.style.display='flex';
    felt.innerHTML=`<div class="die big s20 p-ev" id="evDie"><div class="sh"></div><div class="f">?</div></div><div class="math" id="evMath" style="opacity:0">+${s} = ${roll+s} <span style="color:${win?'#8fe3ad':'#ff9a8a'}">vs ${target}</span></div>`;
    const die=$('evDie'),f=die.querySelector('.f'),dur=T(1100);
    if(dur){die.animate([{transform:'translate(-120px,-60px) rotate(-720deg) scale(.4)',opacity:0},{transform:'translate(10px,-30px) rotate(-90deg) scale(1.15)',opacity:1,offset:.6},{transform:'none'}],{duration:dur,easing:'cubic-bezier(.25,.8,.35,1)'});
      const iv=setInterval(()=>f.textContent=1+Math.floor(Math.random()*20),70);setTimeout(()=>clack(20),dur*.6);await new Promise(r=>setTimeout(r,dur));clearInterval(iv)}
    f.textContent=roll;sfx(win?'rare':'defeat');if(roll===20){flash();}
    $('evMath').style.opacity=1;await new Promise(r=>setTimeout(r,T(700)));
  }else out=o.out;
  res.text=out.text;res.fxText=applyFx(out.fx);
  run.event.res=res;save();renderEvent();
}
function applyFx(fx){
  const h=H(),txt=[];
  for(const f of fx){
    if(f[0]==='stat'){withHp(()=>{h.base[f[1]]+=f[2]});txt.push(`+${f[2]} ${f[1]}`)}
    if(f[0]==='gold'){run.gold=Math.max(0,run.gold+f[1]);txt.push(`${f[1]>0?'+':''}${f[1]} gold`)}
    if(f[0]==='token'){run.tokens+=f[1];txt.push(`+${f[1]} reroll token`)}
    if(f[0]==='hp'){const b=h.hp;h.hp=Math.max(1,h.hp+f[1]);txt.push(`${h.hp-b} HP`)}
    if(f[0]==='heal'){const b=h.hp;h.hp=Math.min(maxHp(),h.hp+f[1]);txt.push(`+${h.hp-b} HP`)}
    if(f[0]==='potion'){h.potions=Math.max(0,h.potions+f[1]);txt.push(`${f[1]>0?'+':''}${f[1]} potion`)}
    if(f[0]==='pick'){run.bonus.push({pool:f[1],minR:f[2]});txt.push(`A bonus ${STEPNAME[f[1]]} pick (${RAR[f[2]].n} or better)`)}
  }
  renderRunbar();return txt;
}

  if(run.camp==='train'){

  const canHone=SLOTS.some(([s])=>validTarget({hone:true},s));

  $('cTrain').onclick=()=>{run.camp='train';renderCamp()};
}

/* --- rewards & end --- */
function combatOver(win){
  const h=H();h.hp=S.hero.hp;h.potions=S.hero.potions;
  if(!win){finishRun(false);return}
  const t=run.map[run.enc],gold=Math.round((t==='boss'?40:t==='elite'?10:4)*(1+0.25*loopOf()));
  run.gold+=gold;run.stats.won++;(run.stats.hpLog=run.stats.hpLog||[]).push(h.hp+'/'+maxHp());
  const b=h.hp;h.hp=Math.min(maxHp(),h.hp+totals().VIT);
  if(t==='elite')run.eliteBonus=true;
  if(t==='boss')h.hp=maxHp();
  run.reward={gold,heal:h.hp-b,enemy:fightName(run.fight),turns:S.turn,type:t};run.fight=null;run.phase='reward';save();
  renderReward();show('reward');
}
function renderReward(){
  const r=run.reward,el=$('scr-reward');
  el.innerHTML=`<div class="bigicon">${r.type==='boss'?'👑':'🏆'}</div><h2 class="scr center">${r.enemy} defeated</h2><p class="sub center">in ${r.turns} turn${r.turns>1?'s':''}</p>
   <div class="card"><div class="list">💰 +${r.gold} gold${r.type==='boss'?' (boss bonus)':''}<br>❤ ${r.type==='boss'?'Fully healed':`+${r.heal} HP (VIT recovery)`}${r.type==='elite'?'<br>✨ Your next Gear pick includes a guaranteed Rare':''}</div></div>
   <div style="height:12px"></div><button class="btn primary wide" id="rwNext">${r.type==='boss'?(run.level<3?'Claim a Legendary':'Finish the run'):'Continue'}</button>`;
  $('rwNext').onclick=()=>{const boss=r.type==='boss',level=run.level;run.reward=null;if(boss)showCinematic('complete',level,()=>completeEncounter());else completeEncounter()};
}
function finishRun(win){
  const firstWin=win&&!town.stats.wins;
  if(win)markWin();
  const g=run.gold;town.bank+=g;town.stats.runs++;
  const depth=run.level*100+Math.min(13,run.enc+(win?0:1));if(depth>town.stats.best)town.stats.best=depth;saveTown();
  const bank=town.bank;const enc=run.enc+(win?0:1);
  const el=$('scr-end');const h=H();
  el.innerHTML=`<div class="bigicon">${win?'🏆':'🪦'}</div><h2 class="scr center">${win?'Victory! The run is complete':run.endless&&run.level>3?'The Endless Spire claims you':'Your run has ended'}</h2>
   <p class="sub center">${win?`The Gearmind grinds to a halt. +100 gold win bonus.${firstWin?' 🚪 The Spire Gate has opened: Endless runs are now available.':''}`:`Fallen in ${levelTitle()}, encounter ${enc} of 13${run.fight?', to '+fightName(run.fight):''}.${run.won?' You had already beaten the Gearmind.':''}`}</p>
   <div class="card"><div class="list">💰 ${g} gold earned this run, banked in town<br>🏦 Town bank: ${bank} gold<br>⚔️ Fights won: ${run.stats.won} · 🃏 cards taken: ${run.stats.cards}<br>
   🎒 Final kit: ${SLOTS.map(([s])=>h.items[s]&&!h.items[s].ref?h.items[s].icon:'').join(' ')}<br>📊 ${STATS.map(k=>`${k} ${totals()[k]}`).join(' · ')}<br>
   ${h.abilities.length?'⚡ '+h.abilities.map(k=>ABIL[k].name).join(', ')+'<br>':''}${h.traits.length?'🧬 '+h.traits.map(k=>TRAITS[k].name).join(', '):''}</div></div>
   <div style="height:12px"></div><button class="btn primary wide" id="endNew">🏘️ Return to town</button>`;
  clearSave();run=null;$('runbar').style.display='none';show('end');
  $('endNew').onclick=()=>renderTown();
}

function openGear(){if(!run||run.phase==='combat')return;gearBack=run.phase;renderGear();show('gear')}
function renderGear(sel){
  const h=H(),t=totals(),el=$('scr-gear');

  html+=`<div class="card" style="margin-top:10px"><div class="list"><b>Stats</b> ${STATS.map(k=>`${k} ${t[k]}`).join(' · ')} · ${maxHp()} max HP<br>
   <b>Abilities</b> ${h.abilities.map(k=>`${ABIL[k].icon} ${ABIL[k].name} (${ABIL[k].req}: ${ABIL[k].desc}; cooldown ${ABIL[k].cd})`).join(', ')||'none yet'}<br>
   <b>Traits</b> ${h.traits.map(k=>`${TRAITS[k].icon} ${TRAITS[k].name}: ${TRAITS[k].desc}`).join(' ')||'none yet'}<br>
   <b>Potions</b> ${h.potions} · <b>Reroll tokens</b> ${run.tokens}</div></div>
   <div style="height:10px"></div><button class="btn primary wide" id="gBack">Back</button>`;
  el.innerHTML=html;
  el.querySelectorAll('.tslot').forEach(b=>b.onclick=()=>{$('gDetail').innerHTML=slotDetail(b.dataset.s)});

  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const it=h.backpack.splice(Number(b.dataset.x),1)[0];const g=SCRAP[it.r]||2;run.gold+=g;toast(`Scrapped ${it.name}: +${g} gold`);save();renderGear();renderRunbar()});
  $('gBack').onclick=()=>{show(gearBack);if(gearBack==='draft')renderDraft();if(gearBack==='camp')renderCamp();if(gearBack==='event')renderEvent();if(gearBack==='reward')renderReward()};
}
function slotDetail(s){
  const h=H(),it=h.items[s],main=it&&it.ref?h.items[it.ref]:it;
  const rn=(h.runes[s]||[]).map(r=>`◆ ${RUNES[r].name}: ${RUNES[r].desc}`).join('<br>');
  if(!main)return `<b>${SLOTNAME[s]}</b>: empty${rn?'<br>'+rn:''}`;
  const kws=itemKws(main).map(k=>`${KW[k].g} ${KW[k].n}: ${KW[k].t}`).join('<br>');
  return `<b>${main.icon} ${main.name}</b> <span class="muted">(${SLOTNAME[s]}, ${RAR[main.r].n})</span><br>${itemDesc(main,true)}${main.imbues.length?`<br>Imbued: ${main.imbues.map(k=>KW[k].n).join(', ')}`:''}${main.step?`<br>Honed ×${main.step}`:''}${kws?'<br>'+kws:''}${rn?'<br>'+rn:''}`;
}

function loadLocal(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}

/* account storage: one write at a time per doc, newest value wins */
const pendingW={},inflightW={};
function cloudWrite(name,val){if(!cloud)return;pendingW[name]=val;pumpW(name)}
async function pumpW(name){
  if(!cloud||inflightW[name]||pendingW[name]===undefined)return;
  const val=pendingW[name];delete pendingW[name];inflightW[name]=true;
  try{await cloud.db.doc(`data/users/${cloud.uid}/${name}`).set({updated:val.updated||Date.now(),json:JSON.stringify(val)})}
  catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted'){if(pendingW[name]===undefined)pendingW[name]=val;inflightW[name]=false;setTimeout(()=>pumpW(name),1500+Math.random()*1500);return}cloud=null;renderSaveStatus()}
  inflightW[name]=false;if(pendingW[name]!==undefined)pumpW(name);
}
function saveTown(){town.updated=Date.now();saveLocal(TOWN_KEY,town);cloudWrite('town',town)}
function save(){if(!run)return;run.rs=RS;run.updated=Date.now();saveLocal(SAVE_KEY,run);cloudWrite('run',run)}
function loadSave(){const r=loadLocal(SAVE_KEY);return r&&r.v===3&&!r.cleared?r:null}
function clearSave(){const t={v:3,cleared:true,updated:Date.now()};saveLocal(SAVE_KEY,t);cloudWrite('run',t)}
async function initCloud(){
  try{
    for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
    if(!(window.claude&&window.claude.use))return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const res=await Promise.race([Promise.all([db.doc(`data/users/${uid}/town`).get(),db.doc(`data/users/${uid}/run`).get()]),new Promise(r=>setTimeout(()=>r(null),10000))]);
    if(!res)return;
    cloud={db,uid};
    const parse=s=>{try{return s.exists?JSON.parse(s.data().json):null}catch(e){return null}};
    const ct=parse(res[0]),cr=parse(res[1]);
    if(ct&&ct.v===1&&(ct.updated||0)>(town.updated||0)){town=ct;saveLocal(TOWN_KEY,town)}else if(town.updated)cloudWrite('town',town);
    const lr=loadLocal(SAVE_KEY);const onTown=$('scr-town').classList.contains('on');
    if(cr&&cr.v===3&&(cr.updated||0)>((lr&&lr.updated)||0)&&onTown){saveLocal(SAVE_KEY,cr)}else if(lr&&lr.updated)cloudWrite('run',lr);
    if(onTown)renderTown();else renderSaveStatus();
  }catch(e){cloud=null}
}

    const rs=h.runes[s]||[];const grow=slotGrow(h,s,it);

    it.dice.forEach(d=>{const coin=d.pool==='coin';out.push({sides:coin?2:stepN(d.sides,grow),pool:d.pool,kw:coin?[]:[...d.kw,...it.imbues,...rkw],slot:s,item:it})});}

 try{if(!audioNoise){audioNoise=a.createBuffer(1,a.sampleRate,a.sampleRate);const x=audioNoise.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1}const o=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();o.buffer=audioNoise;f.type='bandpass';f.frequency.value=cutoff;f.Q.value=.8;g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(f);f.connect(g);g.connect(bus);o.start(t,Math.random()*.7,dur+.01);audioVoices++;o.onended=()=>{audioVoices=Math.max(0,audioVoices-1);o.disconnect();f.disconnect();g.disconnect();bus.disconnect()}}catch(e){}
}

 }

async function dealDamage(t,amt,o={}){
  if(!t||t.hp<=0)return 0;
  let pa=o.pierceAmt||0;
  if(t.st.vuln&&!o.noVuln){amt=Math.floor(amt*1.5);pa=Math.floor(pa*1.5)}
  let blocked=0;if(!o.pierce){blocked=Math.min(t.block,Math.max(0,amt-pa));t.block-=blocked}
  const hp=amt-blocked;const over=hp-t.hp;t.hp=Math.max(0,t.hp-hp);const el=elFor(t);
  if(blocked){sfx('block');pop(el,`🛡 ${blocked}`,'#8fbcf0')}
  if(hp>0&&o.tag==='magic')sfx('magic');
  if(hp>0){pop(el,`-${hp}`,o.tag==='magic'?'#c9adff':o.tag==='burn'?'#ff9b5e':o.tag==='poison'?'#9be36b':'#ff6b57',true);shake(el,hp);thump(hp)}
  log(`${who(t)} ${t===S.hero?'take':'takes'} ${hp}${o.tag?' '+o.tag:''} damage${blocked?` (${blocked} blocked)`:''}`);
  renderAll();await sleep(T(o.quick?160:330));
  if(t===S.hero){if(t.hp<=0&&!S.over)finish(false)}
  else if(t.hp<=0&&!t.dead){t.dead=true;log(`${t.name} is defeated`);pop(el,'✝','#ddd',true);if(has('bloodlust'))heal(S.hero,4);
    if(!alive().length){if(!S.over)finish(true)}else{tgt();renderAll();
      if(over>0&&has('overkill')&&!o.noOver){pop(el,`💢 Overkill ${over}`,'#ff9a8a');await dealDamage(tgt(),over,{pierce:true,quick:true,noOver:true,noVuln:true})}}}
  return hp;
}

async function thieves(){

    if(E.st.stun||!(E.def.thief||E.intent.steal))continue;
    const pool=S.dice.filter(d=>!d.spent&&d.pool!=='coin');if(!pool.length)return;
    const d=pool.reduce((a,b)=>dv(b)>dv(a)?b:a);const v=dv(d);
    d.spent=true;if(S.selected===d)S.selected=null;
    pop(d.el,'Stolen!','#ffb3b3');await flyTo(d.el,$('eic-'+E.idx),T(450));d.el.remove();
    E.block+=v;pop(elFor(E),`🫳 +${v} block`,'#8fbcf0');log(`${E.name} steals your d${d.sides} (${v}) and gains ${v} block`);
    layout();renderAll();await sleep(T(200));

}
async function spill(dice){
  const tr=$('table').getBoundingClientRect();let end=0;
  if(T(1)===0)clack(8);
  dice.forEach((d,i)=>{
    const src=$('cslot-'+d.slot);const sr=src.getBoundingClientRect();
    const sx=sr.left+sr.width/2-tr.left-DS/2,sy=sr.top+sr.height/2-tr.top-DS/2;
    const dx=sx-d.x,dy=sy-d.y,delay=T(i*85),dur=T(720);
    const r0=(Math.random()*2-1)*560,r2=(Math.random()*2-1)*28;
    if(dur>0){
      d.el.animate([{transform:`translate(${dx}px,${dy}px) rotate(${r0}deg) scale(.35)`,opacity:0},
        {transform:`translate(${dx*.4}px,${dy*.4-90}px) rotate(${r0*.4}deg) scale(1.22)`,opacity:1,offset:.45},
        {transform:`translate(${(Math.random()*2-1)*10}px,-7px) rotate(${r2}deg) scale(1)`,offset:.78},
        {transform:'translate(0,0) rotate(0deg) scale(1)'}],{duration:dur,delay,easing:'cubic-bezier(.25,.8,.35,1)',fill:'backwards'});
      src.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:260,delay});
      setTimeout(()=>clack(d.sides),delay+dur*.78);
    }
    flicker(d,delay+dur);end=Math.max(end,delay+dur);
  });
  await sleep(end+T(90));
}

async function landing(d){

  if(d.sides>2&&d.face===d.sides){
    if(d.kw.includes('burning')&&!d.trig){d.trig=true;applyStatus(tgt(),'burn',2);await sleep(T(160))}
    if(d.kw.includes('vampiric')&&!d.trig2){d.trig2=true;heal(Hh,1,d.el);await sleep(T(120))}

}

async function endTurn(){

  S.phase='busy';S.selected=null;update();
  const Hh=S.hero,E=tgt();
  const blk=poolTotal('blk'),mag=poolTotal('mag'),cb=coinBlock();
  const dmg=attackDamage();
  const live=S.dice.filter(d=>!d.spent);
  const pierceAmt=Math.min(dmg,sum(live.filter(d=>d.pool==='atk'&&d.kw.includes('piercing')).map(dv)));
  const splash=live.filter(d=>d.pool==='atk'&&d.kw.includes('splash')&&d.face===d.sides).map(dv);
  await Promise.all(live.map((d,i)=>{
    const toEnemy=d.pool==='atk'||d.pool==='mag'||(d.pool==='coin'&&d.item.coin.type==='burn');
    return flyTo(d.el,toEnemy?iconFor(E):$('heroHp'),T(430),T(i*45));
  }));

  if(dmg>0){
    if(has('firstblood')&&!S.fbUsed){S.fbUsed=true;pop(elFor(E),'🩸 First Blood','#ff8a8a')}
    iconFor(E).animate([{transform:'none'},{transform:'scale(.8)'},{transform:'none'}],{duration:T(220)||1});
    const dealt=await dealDamage(E,dmg,{pierceAmt});if(S.over)return;
    if(has('leech')&&dealt>=6)heal(Hh,Math.floor(dealt/6));
  }

  if(mag.total>0){await dealDamage(tgt(),mag.total,{pierce:true,tag:'magic'});if(S.over)return}
  if(Hh.st.burn){await dealDamage(Hh,Hh.st.burn,{pierce:true,tag:'burn',noVuln:true});Hh.st.burn--;renderAll();if(S.over)return}
  if(Hh.st.weak)Hh.st.weak--;if(Hh.st.vuln)Hh.st.vuln--;

  await enemyTurn();
}
async function enemyRoll(E,sides,pool,kw=[]){
  const row=$('enemyDice');const ds=[];
  const mk=s=>{const d={sides:s,pool,kw,face:ri(s),mini:true};let v=d.face;if(kw.includes('heavy')&&v<=2)v=3;if(kw.includes('blessed'))v+=1;d.val=v;d.el=dieEl(d,true);row.appendChild(d.el);ds.push(d);return d};
  sides.forEach(s=>{let d=mk(s),n=0;while(kw.includes('exploding')&&d.face===s&&n<2){d=mk(s);n++}});
  ds.forEach((d,i)=>{const delay=T(i*70),dur=T(480);
    if(dur){d.el.animate([{transform:'translate(-40px,-40px) rotate(-300deg) scale(.3)',opacity:0},{transform:'translateY(-14px) rotate(20deg) scale(1.15)',opacity:1,offset:.6},{transform:'none'}],{duration:dur,delay,easing:'ease-out',fill:'backwards'});setTimeout(()=>clack(d.sides),delay+dur*.7)}
    flicker(d,delay+dur)});
  await sleep(T(480+ds.length*70+60));
  return ds.map(d=>d.val);
}
async function enemyAct(E){
  const Hh=S.hero,it=E.intent;$('enemyDice').innerHTML=`<span class="lbl">${E.icon} ${E.name}</span>`;
  const blkF=it.blk?await enemyRoll(E,it.blk,'eblk'):[];
  const mk=E.def.mimic?(S.mimicKw||[]):[];
  if(mk.length){$('enemyDice').innerHTML+=`<span class="lbl">copies ${mk.map(k=>KW[k].g+' '+KW[k].n).join(', ')}</span>`;pop(elFor(E),'Mimic!','#c9adff')}
  const atkF=it.atk?await enemyRoll(E,it.atk,'eatk',mk):[];
  if(blkF.length){const b=sum(blkF);E.block+=b;pop(elFor(E),`+${b} block`,'#8fbcf0');log(`${E.name} blocks ${b}`);renderAll();await sleep(T(220))}
  if(atkF.length){let dmg=sum(atkF)+epow(E);if(E.st.weak)dmg=Math.floor(dmg*.75);
    $('eic-'+E.idx).animate([{transform:'none'},{transform:'translateY(16px) scale(1.2)'},{transform:'none'}],{duration:T(260)||1});
    await dealDamage(Hh,dmg);if(S.over)return}
  if(it.status){applyStatus(Hh,it.status[0],it.status[1]);await sleep(T(280))}
}
async function enemyTurn(){
  S.enemies.forEach(e=>e.block=0);renderAll();
  for(const E of [...S.enemies]){
    if(E.hp<=0)continue;
    const card=$('ec-'+E.idx);card.classList.add('acting');
    if(E.st.poison){await dealDamage(E,E.st.poison,{pierce:true,tag:'poison',noVuln:true,quick:true});if(S.over)return}
    if(E.hp>0){
      if(E.st.stun>0){E.st.stun--;pop(card,'✦ Stunned','#fff',true);log(`${E.name} is stunned`);renderAll();await sleep(T(550))}
      else{await enemyAct(E);if(S.over)return}
      if(E.st.burn){await dealDamage(E,E.st.burn,{pierce:true,tag:'burn',noVuln:true,quick:true});E.st.burn--;if(S.over)return}
      if(E.st.weak)E.st.weak--;if(E.st.vuln)E.st.vuln--;
      E.step++;
      const en=E.def.enrage;
      if(E.hp>0&&en&&!E.enraged&&E.hp<=E.maxHp*en.at){E.enraged=true;E.pattern=stepPat(en.pattern,E.dstep);E.step=0;
        pop(card,'ENRAGED','#ff5a4a',true);shake(card,14);thump(20);log(`${E.name} is enraged`);await sleep(T(500));
        if(en.summon)await summon(en.summon,E)}
      E.intent=E.pattern[E.step%E.pattern.length];
    }
    const c2=$('ec-'+E.idx);if(c2)c2.classList.remove('acting');
    renderAll();await sleep(T(160));
  }
  if(S.turn===10){pop($('enemyDice'),'Enemies grow restless: +1 damage per turn','#ff9a8a');log('Enemies grow restless')}
  await startHeroTurn();
}
function finish(win){
  S.over=true;S.phase='over';update();
  log(win?`Victory in ${S.turn} turns`:`Defeated on turn ${S.turn}`);
  sfx(win?'victory':'defeat');if(win)pop($('enemyRow'),'Victory!','#ffd34d',true);
  const f=S;setTimeout(()=>{if(S===f)combatOver(win)},win?1100:900);
}

/* combat rendering */
function buildEnemyCards(){
  const row=$('enemyRow');row.className='erow'+(S.enemies.length===1?' one':'');
  row.style.gridTemplateColumns=`repeat(${S.enemies.length},minmax(0,1fr))`;
  row.innerHTML=S.enemies.map(e=>`<div class="ecard" id="ec-${e.idx}" data-i="${e.idx}"><div class="etop"><span class="eic" id="eic-${e.idx}">${e.icon}</span><div class="eint" id="ei-${e.idx}"></div></div><div class="enm" id="en-${e.idx}"></div><div class="hpbar"><div class="fill" id="ehf-${e.idx}"></div><span id="eht-${e.idx}"></span></div><div class="chips" id="es-${e.idx}"></div></div>`).join('');
}
function renderDoll(){
  const h=S.hero;
  $('doll').innerHTML=SLOTS.map(([s,label])=>{
    const it=h.items[s];const rn=(h.runes[s]||[]).length?`<span class="rdot">${'◆'.repeat(h.runes[s].length)}</span>`:'';
    if(it&&it.ref){const m=h.items[it.ref];return `<div class="slot two" id="cslot-${s}" data-s="${it.ref}"><span class="ic">${m.icon}</span><span class="dl">2-hand</span>${rn}</div>`}
    if(!it)return `<div class="slot empty" id="cslot-${s}" data-s="${s}"><span class="el">${label}</span>${rn}</div>`;
    const pool=it.dice.length?it.dice[0].pool:'';
    const grow=slotGrow(h,s,it);
    const lbl=it.dice.length?(pool==='coin'?'coin':fmtDice(it.dice.map(d=>stepN(d.sides,grow)))):Object.keys(it.stats||{}).map(k=>`+${it.stats[k]} ${k}`).join(' ');
    return `<div class="slot" data-r="${it.r}" style="--rar:${RAR[it.r].c}" id="cslot-${s}" data-s="${s}"><span class="ic">${it.icon}</span><span class="dl ${pool?'c-'+pool:''}">${lbl}</span>${itemMarks(it,s,h)}</div>`;
  }).join('');
}
function statusChips(t){
  let h=t.block?`<span class="chip block">🛡 ${t.block}</span>`:'';
  for(const k in STI)if(t.st[k])h+=`<span class="chip" style="color:${STI[k].c}">${STI[k].i}${t===S.hero?' '+STI[k].n:''} ${t.st[k]}</span>`;
  return h;
}
function intentHTML(E){
  if(E.hp<=0)return '<span class="muted">defeated</span>';
  if(E.st.stun)return '<span style="color:#fff">✦ stunned</span>';
  const it=E.intent,parts=[],p=epow(E);
  if(it.atk)parts.push(`⚔ ${fmtDice(it.atk)}${p?'+'+p:''}`);
  if(it.blk)parts.push(`🛡 ${fmtDice(it.blk)}`);
  if(it.status)parts.push(`<span style="color:${STI[it.status[0]].c}">${STI[it.status[0]].i} ${STI[it.status[0]].n} ${it.status[1]}</span>`);
  if(E.def.thief||it.steal)parts.push('<span style="color:#ffb3b3">🫳 steal</span>');
  if(E.def.mimic)parts.push('<span style="color:#c9adff">🪞 mimic</span>');
  return parts.join('<br>');
}
function renderAll(){
  if(!S)return;const Hh=S.hero;const t=tgt();
  S.enemies.forEach(E=>{
    const card=$('ec-'+E.idx);if(!card)return;
    card.classList.toggle('dead',E.hp<=0);card.classList.toggle('tgt',!!t&&E===t&&S.enemies.length>1&&!S.over);
    $('en-'+E.idx).textContent=E.name+(E.enraged?' · enraged':'');
    $('ehf-'+E.idx).style.width=(100*E.hp/E.maxHp)+'%';$('eht-'+E.idx).textContent=`${E.hp}/${E.maxHp}`;
    $('es-'+E.idx).innerHTML=statusChips(E);$('ei-'+E.idx).innerHTML=intentHTML(E);
  });
  $('heroName').innerHTML=`🧑 You${Hh.traits.length?` <small>${Hh.traits.map(k=>TRAITS[k].icon+' '+TRAITS[k].name).join(' · ')}</small>`:''}`;
  $('heroFoldNote').textContent=`❤ ${Hh.hp}/${Hh.maxHp}${Hh.block?' · 🛡 '+Hh.block:''}${Object.keys(Hh.st).some(k=>Hh.st[k]>0)?' · '+Object.keys(Hh.st).filter(k=>Hh.st[k]>0).map(k=>STI[k].i+Hh.st[k]).join(' '):''}`;
  $('heroHpFill').style.width=(100*Hh.hp/Hh.maxHp)+'%';$('heroHpText').textContent=`${Hh.hp} / ${Hh.maxHp}`;
  $('heroStatus').innerHTML=statusChips(Hh);
  const s=Hh.stats;
  $('heroStats').innerHTML=`${STATS.map(k=>`<span class="n"><b>${k}</b> ${s[k]}</span>`).join(' ')}<br>
   <span class="d">+${strB()} dmg · ${baseRerolls()} reroll${baseRerolls()>1?'s':''} · +${intB()} magic/die<br>keep ${carry()===Infinity?'all':carry()} block · heads ${Math.round(headsP()*100)}% · d20 crit ${critT()}+</span>`;
  renderLanes();update();
  if(run)$('rbHp').textContent=`${Hh.hp}/${Hh.maxHp}`;
}
let hintOverride=null;
function setHint(t){hintOverride=t;$('hint').textContent=t;setTimeout(()=>{if(hintOverride===t){hintOverride=null;update()}},2600)}
function update(){
  if(!S)return;const Hh=S.hero,E=tgt(),dec=S.phase==='decide';
  if(!dec||S.selected||(abilityHint!==null&&!ready(abilityHint)))abilityHint=null;
  S.dice.forEach(d=>{d.el.classList.toggle('sel',S.selected===d);d.el.classList.toggle('eligible',dec&&!S.selected&&abilityHint!==null&&!d.spent&&!!Hh.abilities[abilityHint]&&Hh.abilities[abilityHint].test(d))});
  $('abilities').innerHTML=Hh.abilities.map((a,i)=>{const rd=ready(i),left=(S.ready[i]||0)-S.turn,ok=dec&&S.selected&&rd&&a.test(S.selected);
    return `<button class="ab ${rd?'':'used'} ${ok?'ready':''} ${abilityHint===i&&!S.selected?'hinting':''}" id="ab-${i}" data-i="${i}"><span class="ai">${a.icon}</span><span class="an">${a.name}</span><span class="ar">${rd?`${a.req} · CD ${cdOf(a)}`:`⏳ ${left} turn${left>1?'s':''}`}</span></button>`}).join('')
   +`<button class="ab ${S.potionUsed||!Hh.potions?'used':''}" id="ab-pot" data-i="pot"><span class="ai">🧪</span><span class="an">Potion ×${Hh.potions}</span><span class="ar">heal ${Hh.potHeal}</span></button>`;
  $('rerollBtn').textContent=`↻ Reroll (${S.rerolls}${S.freeReroll?' +1 free':''})`;
  $('rerollBtn').disabled=!(dec&&S.selected&&(S.rerolls>0||S.freeReroll));
  $('endBtn').disabled=!dec;$('endBtn').textContent=S.phase==='busy'?'…':'End turn';
  if(S.dice.length&&E){
    const blk=poolTotal('blk'),mag=poolTotal('mag'),cb=coinBlock(),dmg=attackDamage();
    const v=x=>E.st.vuln?Math.floor(x*1.5):x;
    const hit=Math.max(0,v(dmg)-E.block),bl=Math.min(E.block,v(dmg));
    const parts=[];
    if(dmg)parts.push(`Attack hits ${S.enemies.length>1?E.name+' ':''}for <b>${hit}</b>${bl?` (${bl} blocked)`:''}`);
    if(mag.total)parts.push(`magic <b>${v(mag.total)}</b>`);
    const myBlock=Hh.block+blk.total+cb;
    const inc=alive().filter(e=>!e.st.stun&&e.intent.atk).map(e=>{const p=epow(e);return fmtDice(e.intent.atk)+(p?'+'+p:'')});
    $('preview').innerHTML=`${parts.join(' + ')||'No damage this turn'}.<br>You block <b>${myBlock}</b> against ${inc.length?inc.join(', '):'no attacks'}.`;
  }else $('preview').innerHTML=S.over?'':'<span style="color:var(--muted)">'+(S.turn?'Enemy turn…':'')+'</span>';
  if(!hintOverride){
    let h='';
    if(dec&&!S.selected)h=(alive().length>1?'Tap an enemy to target it. ':'')+(Hh.abilities.length?'Tap an ability to light up the dice it can use, or tap a die to reroll or spend it.':'Tap a die to reroll it.');
    if(dec&&S.selected){const d=S.selected;const kws=[...new Set(d.kw)].map(k=>`${KW[k].g} ${KW[k].n}`).join(', ');
      const ok=Hh.abilities.filter((a,i)=>ready(i)&&a.test(d)).map(a=>a.name);
      h=`d${d.sides} from ${d.item.name}${kws?' · '+kws:''}${ok.length?' · can use: '+ok.join(', '):''}`}
    $('hint').textContent=h;
  }
}

/* collapsible map and player panels: a display preference, separate from saves */
const FOLD_PREF_KEY='dicebound-folds-v1';
function initFolds(){
  let pref={};try{pref=JSON.parse(localStorage.getItem(FOLD_PREF_KEY)||'{}')||{}}catch(e){}
  for(const [key,id] of [['map','mapFold'],['hero','heroFold']]){
    const el=$(id);if(typeof pref[key]==='boolean')el.open=pref[key];
    el.addEventListener('toggle',()=>{
      let q={};try{q=JSON.parse(localStorage.getItem(FOLD_PREF_KEY)||'{}')||{}}catch(e){}
      q[key]=el.open;try{localStorage.setItem(FOLD_PREF_KEY,JSON.stringify(q))}catch(e){}
      if(key==='hero'&&S&&$('scr-combat').classList.contains('on'))requestAnimationFrame(()=>layout(false));
    });
  }
}
initFolds();
/* ================= wiring ================= */
$('rerollBtn').onclick=doReroll;
$('endBtn').onclick=endTurn;
$('abilities').addEventListener('click',e=>{const b=e.target.closest('.ab');if(!b)return;if(b.dataset.i==='pot')usePotion();else useAbility(Number(b.dataset.i))});
$('doll').addEventListener('click',e=>{const s=e.target.closest('.slot');if(!s||!S)return;const it=S.hero.items[s.dataset.s];if(it&&!it.ref)setHint(`${it.icon} ${it.name}: ${itemDesc(it,true)}`)});
$('gearBtn').onclick=openGear;
$('enemyRow').addEventListener('click',e=>{const c=e.target.closest('.ecard');if(c)setTarget(Number(c.dataset.i))});
const speedLabel=()=>speed===1?'1×':speed===2?'2×':'⚡';
$('speedBtn').textContent=speedLabel();$('soundBtn').textContent=soundOn?'🔊':'🔇';
$('speedBtn').onclick=()=>{speed=speed===1?2:speed===2?0:1;$('speedBtn').textContent=speedLabel();savePrefs()};
$('soundBtn').onclick=audioSettings;
window.addEventListener('resize',()=>{if(S&&$('scr-combat').classList.contains('on'))layout()});

function resume(){
  run=loadSave();if(!run){renderTown();return}
  RS=run.rs;
  if(run.phase==='draft'&&run.draft){renderDraft();show('draft')}
  else if(run.phase==='combat'&&run.fight){startCombat()}
  else if(run.phase==='event'&&run.event){renderEvent();show('event')}
  else if(run.phase==='camp'){renderCamp();show('camp')}
  else if(run.phase==='reward'&&run.reward){renderReward();show('reward')}
  else startDraft('main');
}
/* Storybook transitions are presentation-only; no combat or run RNG is consumed. */
const CINEMATICS={
  1:{glow:'#72b77d88',icon:'🪦',bossIcon:'👑',arrival:['The Overgrown Crypt','Beneath tangled roots, forgotten stones guard an older secret.'],boss:['The Bone Warden','The tomb stirs. Its ancient keeper rises to bar your path.'],complete:['The Crypt Falls Silent','The Warden is defeated. Beyond the roots, another road opens.']},
  2:{glow:'#57b9c888',icon:'⚓',bossIcon:'🐙',arrival:['The Sunken Market','Under drowned lanterns, traders and thieves still bargain in the dark.'],boss:['The Tide Broker','From the flooded stalls, the Broker comes to collect what is owed.'],complete:['The Market Is Yours','The water settles. A route through brass and broken machinery awaits.']},
  3:{glow:'#d2a25d88',icon:'⚙️',bossIcon:'⚙️',arrival:['The Clockwork Spire','High above the ruins, a thousand gears turn toward a single purpose.'],boss:['The Gearmind','The machine studies your every move. Its great heart begins to turn.'],complete:['The Gearmind Is Stilled','The last cog slows. Your impossible engine has outlasted its maker.']}
};
/* Endless depths reuse their theme's scene with their own words */
const DEEP={arrival:'The way loops back on itself, older and angrier. Everything here has grown stronger since you last passed.',boss:'It has been waiting for you down here, and it has grown.',complete:'Another depth falls. The Spire only goes deeper.'};
const CINE_PREF='dicebound-cinematics-v1';let cineBrief=false,cineContinue=null;
try{cineBrief=!!JSON.parse(localStorage.getItem(CINE_PREF)||'false')}catch(e){}
function showCinematic(kind,level,after){
 const th=((level-1)%3)+1,scene=CINEMATICS[th];if(!scene||cineBrief){if(after)after();return}
 const deep=level>3,num=['I','II','III'][level-1];
 let [title,description]=scene[kind];
 if(deep){title=kind==='complete'?`Depth ${level} Conquered`:kind==='boss'?`${title}, Reborn`:`${title}: Depth ${level}`;description=DEEP[kind]}
 if(kind==='complete'&&level===3&&run&&run.endless)description='The last cog slows, and the floor gives way to stairs that keep going down. The Endless Spire awaits.';
 $('cineArt').style.setProperty('--cine-glow',scene.glow);
 $('cineSigil').textContent=kind==='complete'?'🏆':kind==='boss'?scene.bossIcon:scene.icon;
 $('cineKicker').textContent=deep?`ENDLESS · DEPTH ${level} · ${kind==='arrival'?'ARRIVAL':kind==='boss'?'A BOSS APPROACHES':'COMPLETE'}`:kind==='arrival'?`CHAPTER ${num} · ARRIVAL`:kind==='boss'?'A BOSS APPROACHES':`CHAPTER ${num} · COMPLETE`;
 $('cineTitle').textContent=title;$('cineText').textContent=description;
 const last=level>=3&&!(run&&run.endless);
 $('cineNext').textContent=kind==='arrival'?(deep?'Descend':'Enter chapter'):kind==='boss'?'Face the boss':last?'Claim victory':level>=3?'Descend deeper':'Continue onward';
 $('cineBrief').checked=cineBrief;cineContinue=after||null;$('cine').hidden=false;
 sfx(kind==='boss'?'forge':kind==='complete'?'victory':'rare');
 $('cineNext').focus({preventScroll:true});
}
function closeCinematic(){const o=$('cine');if(o.hidden)return;o.hidden=true;const cb=cineContinue;cineContinue=null;if(cb)cb()}
$('cineNext').onclick=e=>{e.stopPropagation();closeCinematic()};
/* "Tap to continue": anywhere on the card except the Brief toggle */
$('cine').addEventListener('click',e=>{if(e.target.closest('.cine-footer label'))return;closeCinematic()});
$('cineBrief').onchange=e=>{cineBrief=e.target.checked;try{localStorage.setItem(CINE_PREF,JSON.stringify(cineBrief))}catch(err){}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('cine').hidden){e.preventDefault();closeCinematic()}});

initTown();renderTown();initCloud();
</script>
